<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Animaux">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<title>Les jeux</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  /* Page blanche plein écran : menu de 3 jeux, puis plateau (voix en haut, images au centre, étoiles ou flèche en bas).
     Thème clair volontaire (page blanche demandée), couleurs toutes explicites. */
  :root {
    --bg: #ffffff;
    --ink: #3a3550;
    --soft: #8d88a3;
    --line: #ece9f3;
    --sun: #ffb703;
    --good: #2ec27e;
    --good-dark: #1f9a61;
    --bad: #ef6f6c;
    --display: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --cell: 220px;
    /* tailles qui suivent l'écran : téléphone, iPad, ordinateur */
    --speak: clamp(52px, 12vmin, 96px);
    --next: clamp(52px, 11vmin, 84px);
    --star: clamp(18px, 4.2vmin, 36px);
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--display);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  input { -webkit-user-select: text; user-select: text; }
  #app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
  }

  /* ---------- barre du haut ---------- */
  .top { display: flex; align-items: center; justify-content: center; min-height: var(--speak); }
  .speak {
    width: var(--speak); height: var(--speak);
    border-radius: 50%;
    border: 0;
    background: #fff4d6;
    box-shadow: 0 6px 0 #ffe2a0;
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .12s;
  }
  .speak:active { transform: translateY(4px); box-shadow: 0 2px 0 #ffe2a0; }
  .speak svg { width: 54%; height: 54%; }
  .speak.talking svg .wave { animation: wave 0.9s ease-in-out infinite; }
  .speak.talking svg .wave2 { animation-delay: .15s; }
  @keyframes wave { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  #app[data-mode="discover"] .speak { visibility: hidden; }

  .gear {
    position: fixed;
    right: max(8px, env(safe-area-inset-right, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    width: 56px; height: 56px;
    border: 0; background: transparent;
    display: grid; place-items: center;
    cursor: pointer;
    opacity: .35;
    z-index: 15;
  }
  .gear svg { width: 30px; height: 30px; }
  .gear .ring { position: absolute; inset: 4px; width: auto; height: auto; }
  .gear .ring circle { transition: stroke-dashoffset 1.4s linear; }
  .gear.holding .ring circle { stroke-dashoffset: 0 !important; }
  .gear.holding { opacity: .8; }
  .gear.home { right: auto; left: max(8px, env(safe-area-inset-left, 0px)); }

  /* ---------- plateau ---------- */
  .board {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: calc(var(--cell) * 0.12);
    min-height: 0;
  }
  .animal {
    width: var(--cell);
    height: var(--cell);
    border-radius: 50%;
    border: 0;
    padding: 0;
    background: var(--tint, #f3f0fa);
    display: grid;
    place-items: center;
    cursor: pointer;
    position: relative;
    animation: popin .45s cubic-bezier(.3,1.6,.5,1) both, bob 3.2s ease-in-out infinite;
    animation-delay: var(--d, 0s), calc(var(--d, 0s) + .5s);
  }
  .animal span {
    font-size: calc(var(--cell) * 0.6);
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 4px 0 rgba(58,53,80,.08));
  }
  .animal.photo { background: #fff; box-shadow: 0 0 0 8px var(--tint); }
  .animal.photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .animal.win {
    animation: win .9s cubic-bezier(.3,1.6,.5,1) both;
    z-index: 3;
    box-shadow: 0 0 0 10px var(--good);
  }
  .animal.fade { opacity: .18; transform: scale(.85); transition: opacity .35s, transform .35s; animation: none; }
  .animal.no { animation: shake .5s ease-in-out; box-shadow: 0 0 0 8px var(--bad); }
  .animal.hint { animation: hint 1.1s ease-in-out infinite; }
  .animal.big { animation: boing .8s cubic-bezier(.3,1.6,.5,1) both; z-index: 3; box-shadow: 0 0 0 10px var(--sun); }

  @keyframes popin { from { transform: scale(0) rotate(-12deg); } to { transform: scale(1) rotate(0); } }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @keyframes win { 0% { transform: scale(1) } 40% { transform: scale(1.3) rotate(-6deg) } 70% { transform: scale(1.18) rotate(5deg) } 100% { transform: scale(1.22) } }
  @keyframes boing { 0% { transform: scale(1) } 35% { transform: scale(1.22) rotate(-5deg) } 65% { transform: scale(1.08) rotate(4deg) } 100% { transform: scale(1.14) } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-14px) rotate(-4deg) } 40% { transform: translateX(12px) rotate(3deg) } 60% { transform: translateX(-8px) } 80% { transform: translateX(5px) } }
  @keyframes hint { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,183,3,.0) } 50% { transform: scale(1.08); box-shadow: 0 0 0 14px rgba(255,183,3,.55) } }

  /* ---------- bas : étoiles ou flèche ---------- */
  .bottom { display: flex; justify-content: center; align-items: center; min-height: calc(var(--star) * 1.5); }
  #app[data-mode="discover"] .bottom { min-height: var(--next); }
  .stars { display: flex; justify-content: center; gap: clamp(3px, 1vmin, 10px); align-items: center; }
  .star { font-size: var(--star); opacity: .14; filter: grayscale(1); transition: opacity .3s, filter .3s, transform .3s; }
  .star.on { opacity: 1; filter: none; animation: starpop .6s cubic-bezier(.3,1.8,.5,1); }
  @keyframes starpop { 0% { transform: scale(0) rotate(-90deg) } 100% { transform: scale(1) rotate(0) } }
  .next {
    width: var(--next); height: var(--next); border-radius: 50%; border: 0;
    background: var(--good); box-shadow: 0 6px 0 var(--good-dark);
    display: grid; place-items: center; cursor: pointer;
  }
  .next:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--good-dark); }
  .next svg { width: 52%; height: 52%; }
  #app[data-mode="discover"] .stars { display: none; }
  #app:not([data-mode="discover"]) .next { display: none; }

  /* ---------- feu d'artifice ---------- */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 12; }

  /* ---------- menu ---------- */
  .menu {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(20px, 4vh, 40px);
    z-index: 10;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    text-align: center;
    overflow: auto;
  }
  .menu h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(28px, min(6.5vw, 9vh), 68px);
    letter-spacing: .01em;
    text-wrap: balance;
  }
  .menu h1 em { font-style: normal; color: var(--sun); }
  .tiles { display: flex; gap: clamp(14px, 2.5vw, 28px); flex-wrap: wrap; justify-content: center; }
  .tile {
    width: clamp(140px, min(26vw, 40vh), 250px);
    aspect-ratio: 1 / 1.08;
    max-width: 100%;
    border: 0;
    border-radius: 36px;
    background: var(--tile);
    box-shadow: 0 8px 0 var(--tile-edge);
    font-family: var(--display);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    cursor: pointer;
    padding: 12px;
    box-sizing: border-box;
    transition: transform .12s;
  }
  .tile:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--tile-edge); }
  @media (hover: hover) { .tile:hover { transform: translateY(-3px); } .speak:hover, .next:hover { filter: brightness(1.04); } }
  .tile-text { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tile-art { font-size: clamp(44px, min(8vw, 12vh), 86px); line-height: 1.1; display: flex; gap: .05em; align-items: center; justify-content: center; }
  .tile-art img { width: .9em; height: .9em; border-radius: 50%; object-fit: cover; border: 3px solid #fff; margin-left: -.18em; }
  .tile-art img:first-child { margin-left: 0; }
  .tile-name { font-size: clamp(22px, 3vw, 30px); font-weight: 700; }
  .tile-sub { font-size: 15px; color: var(--soft); font-weight: 500; min-height: 1.2em; }
  .menu .hint { margin: 0; color: var(--soft); font-size: clamp(14px, 2.2vmin, 17px); max-width: 34em; }

  /* téléphone en portrait : les jeux deviennent de grandes bandes */
  @media (max-width: 600px) and (orientation: portrait) {
    .tiles { flex-direction: column; width: 100%; max-width: 440px; }
    .tile { width: 100%; aspect-ratio: auto; flex-direction: row; justify-content: flex-start; gap: 18px; padding: 16px 22px; border-radius: 28px; }
    .tile-art { font-size: 52px; min-width: 2.1em; }
    .tile-text { align-items: flex-start; text-align: left; }
  }
  /* écran très bas (téléphone couché) */
  @media (max-height: 500px) {
    #app { padding-block: 6px; }
    .menu { padding-block: 12px; gap: 14px; }
    .tile { border-radius: 26px; gap: 4px; }
    .tile-sub { display: none; }
  }

  /* ---------- menu parent ---------- */
  .panel {
    position: fixed; inset: 0;
    background: rgba(58,53,80,.35);
    display: grid; place-items: center;
    z-index: 20;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    box-sizing: border-box;
  }
  .sheet {
    background: #fff;
    border-radius: 28px;
    padding: 28px;
    width: min(560px, 100%);
    max-height: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    box-sizing: border-box;
    display: grid;
    gap: 22px;
  }
  .sheet h2 { margin: 0; font-size: 28px; }
  @media (max-width: 600px) { .sheet { padding: 20px; gap: 18px; border-radius: 22px; } .seg button { font-size: 18px; padding: 8px 14px; } }
  .sheet h3 { margin: 0 0 10px; font-size: 15px; color: var(--soft); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button {
    font-family: var(--display); font-size: 20px; font-weight: 600;
    border: 2px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 14px; padding: 10px 18px; cursor: pointer; min-width: 64px;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .field {
    font-family: var(--display); font-size: 20px; font-weight: 500; color: var(--ink);
    border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px;
    background: #fff; width: 100%; box-sizing: border-box; min-width: 0;
  }
  .field:focus { outline: none; border-color: var(--sun); }
  .sheet .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .btn {
    font-family: var(--display); font-size: 20px; font-weight: 600;
    border: 0; border-radius: 14px; padding: 12px 22px; cursor: pointer;
    background: #f3f0fa; color: var(--ink);
  }
  .btn.main { background: var(--good); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.wide { width: 100%; }

  .fam-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
  .fam-list li { display: flex; align-items: center; gap: 12px; }
  .fam-list img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none; }
  .fam-list .who { flex: 1; min-width: 0; font-size: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fam-list .del { font-family: var(--display); font-size: 16px; font-weight: 600; border: 0; border-radius: 12px; padding: 8px 12px; background: #f3f0fa; color: var(--ink); cursor: pointer; }
  .fam-list .del.sure { background: var(--bad); color: #fff; }
  .fam-empty { color: var(--soft); font-size: 17px; margin: 0 0 12px; }
  .fam-add { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
  .fam-add .btn { grid-column: 1 / -1; }
  .pick {
    position: relative;
    width: 72px; height: 72px; border-radius: 50%;
    background: #fff1c9; display: grid; place-items: center;
    overflow: hidden; cursor: pointer; font-size: 30px;
  }
  .pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .note { margin: 8px 0 0; color: var(--soft); font-size: 15px; }
  button:focus-visible, .pick:focus-within { outline: 4px solid var(--sun); outline-offset: 4px; }

  /* ---------- easter egg ---------- */
  .egg {
    position: absolute;
    left: max(12px, env(safe-area-inset-left, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    font-size: 34px; line-height: 1;
    background: none; border: 0; padding: 8px;
    cursor: pointer;
  }
  .egg:active { transform: scale(.9) rotate(-10deg); }
  .egg.on::after { content: "🐷"; position: absolute; right: -4px; top: -4px; font-size: 18px; }
  .toast {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 25;
    background: #fff;
    color: var(--ink);
    font-family: var(--display); font-weight: 700;
    font-size: clamp(28px, 6vmin, 56px);
    padding: .5em 1.1em;
    border-radius: 999px;
    box-shadow: 0 10px 0 #ffc2d4, 0 0 0 6px #ffe3ec;
    white-space: nowrap;
    pointer-events: none;
    animation: toastpop .5s cubic-bezier(.3,1.7,.5,1) both;
  }
  @keyframes toastpop { from { transform: translate(-50%, -50%) scale(0) rotate(-8deg); } to { transform: translate(-50%, -50%) scale(1) rotate(0); } }

  @media (prefers-reduced-motion: reduce) {
    .animal { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }
</style>

<div id="app" data-mode="animals">
  <div class="top">
    <button class="speak" id="speak" aria-label="Répéter la question">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M10 25h10l14-11v36L20 39H10z" fill="#ffb703" stroke="#e09400" stroke-width="3" stroke-linejoin="round"/>
        <path class="wave" d="M42 24c4 4 4 12 0 16" fill="none" stroke="#e09400" stroke-width="4" stroke-linecap="round"/>
        <path class="wave wave2" d="M48 18c8 8 8 20 0 28" fill="none" stroke="#e09400" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="board" id="board"></div>
  <div class="bottom">
    <div class="stars" id="stars" aria-label="Étoiles gagnées"></div>
    <button class="next" id="next" aria-label="D'autres animaux">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M12 6l6 6-6 6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<button class="gear" id="gear" aria-label="Réglages parent (appui long)">
  <svg class="ring" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="21" fill="none" stroke="#3a3550" stroke-width="3" stroke-dasharray="132" stroke-dashoffset="132" transform="rotate(-90 24 24)"/>
  </svg>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#3a3550" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
</button>

<button class="gear home" id="home" aria-label="Retour au choix des jeux (appui long)" hidden>
  <svg class="ring" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="21" fill="none" stroke="#3a3550" stroke-width="3" stroke-dasharray="132" stroke-dashoffset="132" transform="rotate(-90 24 24)"/>
  </svg>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#3a3550" d="M12 3.2 2.6 11.1a1 1 0 0 0 1.3 1.5l.6-.5V20a1 1 0 0 0 1 1h4.3v-5.5h4.4V21h4.3a1 1 0 0 0 1-1v-7.9l.6.5a1 1 0 0 0 1.3-1.5z"/></svg>
</button>

<canvas id="fx"></canvas>

<div class="menu" id="menu">
  <h1 id="menuTitle">Les jeux</h1>
  <div class="tiles">
    <button class="tile" data-mode="animals" style="--tile:#fff1c9; --tile-edge:#ffe08a">
      <span class="tile-art">🐶🐮</span>
      <span class="tile-text"><span class="tile-name">Où est… ?</span>
      <span class="tile-sub">Trouver l'animal</span></span>
    </button>
    <button class="tile" data-mode="discover" style="--tile:#e3f6ea; --tile-edge:#bfe8cd">
      <span class="tile-art">🐸🎵</span>
      <span class="tile-text"><span class="tile-name">Découverte</span>
      <span class="tile-sub">Toucher et écouter</span></span>
    </button>
    <button class="tile" data-mode="family" style="--tile:#ffe3ec; --tile-edge:#ffc2d4">
      <span class="tile-art" id="familyArt">📷</span>
      <span class="tile-text"><span class="tile-name">La famille</span>
      <span class="tile-sub" id="familySub">Ajoute des photos</span></span>
    </button>
  </div>
  <p class="hint">Monte le son. Pour les réglages et les photos, garde le doigt appuyé sur la roue en haut à droite.</p>
  <button class="egg" id="egg" aria-label="Surprise">🔫</button>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="panel" id="panel" hidden>
  <div class="sheet" role="dialog" aria-label="Réglages">
    <h2>Réglages</h2>
    <button class="btn wide" id="toMenu">Revenir au choix des jeux</button>
    <div>
      <h3>Prénom de l'enfant</h3>
      <input class="field" id="kidName" type="text" maxlength="20" autocomplete="off" placeholder="Prénom">
    </div>
    <div>
      <h3>Nombre d'images</h3>
      <div class="seg" id="segCount">
        <button data-v="auto">Auto</button>
        <button data-v="2">2</button>
        <button data-v="3">3</button>
        <button data-v="4">4</button>
        <button data-v="6">6</button>
      </div>
    </div>
    <div>
      <h3>Animaux</h3>
      <div class="seg" id="segPool">
        <button data-v="easy">Les plus connus</button>
        <button data-v="all">Tous</button>
      </div>
    </div>
    <div>
      <h3>Voix</h3>
      <div class="seg" id="segRate">
        <button data-v="0.75">Lente</button>
        <button data-v="0.9">Normale</button>
      </div>
    </div>
    <div id="famSection">
      <h3>La famille</h3>
      <ul class="fam-list" id="famList"></ul>
      <p class="fam-empty" id="famEmpty">Ajoute au moins 2 personnes pour jouer.</p>
      <div class="fam-add">
        <label class="pick" aria-label="Choisir une photo">
          <span aria-hidden="true">📷</span>
          <img id="famPreview" alt="" hidden>
          <input type="file" id="famFile" accept="image/*">
        </label>
        <input class="field" id="famName" type="text" maxlength="24" autocomplete="off" placeholder="Papa, Maman, Mamie…">
        <button class="btn main" id="famAdd" disabled>Ajouter</button>
      </div>
      <p class="note">Les photos restent sur cet appareil.</p>
    </div>
    <div class="row">
      <button class="btn" id="testVoice">Tester la voix</button>
      <button class="btn main" id="closePanel">Reprendre</button>
    </div>
  </div>
</div>

<script>
(() => {
  const DEFAULT_KID = "";

  // ------------------------------------------------------------------
  // Animaux et leurs cris
  // ------------------------------------------------------------------
  const ANIMALS = [
    // les plus connus
    { e: "🐶", name: "le chien",    t: "#ffe9d6", easy: 1, c: "Le chien fait ouaf, ouaf !" },
    { e: "🐱", name: "le chat",     t: "#fff1c9", easy: 1, c: "Le chat fait miaou !" },

    { e: "🐰", name: "le lapin",    t: "#f6ecff", easy: 1, c: "Le lapin saute : hop, hop, hop !" },
    { e: "🐻", name: "l'ours",      t: "#f3e6da", easy: 1, c: "L'ours fait grrr !" },
    { e: "🐵", name: "le singe",    t: "#fbeedd", easy: 1, c: "Le singe fait hou, hou, ha, ha !" },
    { e: "🐸", name: "la grenouille", t: "#e4f7dc", easy: 1, c: "La grenouille fait croa, croa !" },
    { e: "🐭", name: "la souris",   t: "#f0eef4", easy: 1, c: "La souris fait couic, couic !" },
    // pour aller plus loin
    { e: "🦒", name: "la girafe",   t: "#fff3d1", c: "La girafe a un très long cou !" },
    { e: "🐯", name: "le tigre",    t: "#ffe9cf", c: "Le tigre fait grrrr !" },
    { e: "🐍", name: "le serpent",  t: "#e6f6e0", c: "Le serpent fait sssss !" },
    { e: "🐢", name: "la tortue",   t: "#e2f4e6", c: "La tortue marche tout doucement." },
    { e: "🦋", name: "le papillon", t: "#e6f0ff", c: "Le papillon vole, vole !" },
    { e: "🐌", name: "l'escargot",  t: "#f5eee2", c: "L'escargot avance tout doucement." },
    { e: "🐊", name: "le crocodile", t: "#e1f3df", c: "Le crocodile fait clac, clac !" },
    { e: "🦓", name: "le zèbre",    t: "#eff0f3", c: "Le zèbre a des rayures !" },
    { e: "🐝", name: "l'abeille",   t: "#fff5cc", c: "L'abeille fait bzzzz !" },
    { e: "🐞", name: "la coccinelle", t: "#ffe4e1", c: "La coccinelle a des petits points !" },
    { e: "🦉", name: "le hibou",    t: "#f2ebe1", c: "Le hibou fait hou, hou !" },
    { e: "🐧", name: "le pingouin", t: "#e8f1fb", c: "Le pingouin glisse sur la glace !" },
    { e: "🐳", name: "la baleine",  t: "#dcf1ff", c: "La baleine nage dans la mer !" },
    { e: "🐼", name: "le panda",    t: "#f0f0f2", c: "Le panda mange du bambou !" },
    { e: "🦊", name: "le renard",   t: "#ffe7d4", c: "Le renard a une grande queue !" },
    { e: "🐐", name: "la chèvre",   t: "#f3efe6", c: "La chèvre fait bêê !" },
    { e: "🐥", name: "le poussin",  t: "#fff6c8", c: "Le poussin fait piou, piou !" },
    { e: "🐬", name: "le dauphin",  t: "#dff0ff", c: "Le dauphin saute dans l'eau !" },
  ].map(a => ({ ...a, id: a.e }));
  const FAMILY_TINTS = ["#ffe3ec", "#fff1c9", "#e3f6ea", "#e8f4ff", "#f6ecff", "#ffe9d6"];

  // ------------------------------------------------------------------
  // Réglages (gardés sur cet appareil)
  // ------------------------------------------------------------------
  const settings = { count: "auto", pool: "easy", rate: "0.9", kid: DEFAULT_KID, pig: false };
  try { Object.assign(settings, JSON.parse(localStorage.getItem("arthur-animaux") || "{}")); } catch (e) {}
  const saveSettings = () => { try { localStorage.setItem("arthur-animaux", JSON.stringify(settings)); } catch (e) {} };

  // ------------------------------------------------------------------
  // Photos de la famille (IndexedDB, sur l'appareil)
  // ------------------------------------------------------------------
  const DB = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open("arthur-jeu", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("family", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    }));
    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction("family", mode);
      const out = fn(t.objectStore("family"));
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
    }));
    return {
      all: () => tx("readonly", s => s.getAll()).then(r => (r || []).sort((a, b) => a.created - b.created)),
      put: v => tx("readwrite", s => s.put(v)),
      del: id => tx("readwrite", s => s.delete(id)),
    };
  })();
  let family = [];
  async function loadFamily() {
    try { family = await DB.all(); } catch (e) { family = []; }
    renderFamilyList();
    renderMenu();
  }

  // ------------------------------------------------------------------
  // Voix
  // ------------------------------------------------------------------
  const synth = window.speechSynthesis;
  let voice = null;
  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices().filter(v => (v.lang || "").toLowerCase().replace("_", "-").startsWith("fr"));
    if (!vs.length) return;
    const score = v => {
      let s = 0;
      const n = v.name.toLowerCase();
      if ((v.lang || "").toLowerCase().includes("fr-fr")) s += 10;
      if (/premium|enhanced|amélioré|natural/.test(n)) s += 6;
      if (/amélie|amelie|audrey|marie|aurélie|aurelie/.test(n)) s += 5;
      if (/thomas/.test(n)) s += 3;
      if (v.localService) s += 1;
      if (/eddy|flo|grandma|grandpa|jacques|reed|rocko|sandy|shelley/.test(n)) s -= 3;
      return s;
    };
    vs.sort((a, b) => score(b) - score(a));
    voice = vs[0];
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

  const speakBtn = document.getElementById("speak");
  let speechToken = 0;
  function makeUtterance(text) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    if (voice) u.voice = voice;
    u.rate = parseFloat(settings.rate) || 0.9;
    u.pitch = 1.15;
    u.volume = 1;
    return u;
  }
  // now = parler tout de suite (au moment du toucher, exigé par iOS pour la 1re phrase)
  function say(text, done, now) {
    const token = ++speechToken;
    let finished = false;
    const finish = () => {
      if (finished || token !== speechToken) return;
      finished = true;
      speakBtn.classList.remove("talking");
      done && done();
    };
    if (!synth) { setTimeout(finish, 900); return; }
    const u = makeUtterance(text);
    u.onend = finish;
    u.onerror = finish;
    speakBtn.classList.add("talking");
    if (now) { synth.cancel(); synth.speak(u); }
    else {
      synth.cancel();
      // petit délai : Safari iOS perd parfois la phrase juste après cancel()
      setTimeout(() => { if (token === speechToken) synth.speak(u); }, 60);
    }
    // filet de sécurité si onend ne vient jamais
    setTimeout(finish, 1800 + text.length * 110 / (u.rate || 1));
  }
  function stopSpeech() { speechToken++; if (synth) synth.cancel(); speakBtn.classList.remove("talking"); }

  // ------------------------------------------------------------------
  // Sons (générés, pas de fichier à charger)
  // ------------------------------------------------------------------
  let ac = null, master = null;
  function ensureAudio() {
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain();
        master.gain.value = 0.9;
        master.connect(ac.destination);
      }
      if (ac.state !== "running") ac.resume();
    } catch (e) {}
  }
  function tone(freq, t0, dur, type = "triangle", vol = 0.2, bendTo) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (bendTo) o.frequency.exponentialRampToValueAtTime(bendTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function successSound() {
    if (!ac) return;
    const t = ac.currentTime + 0.02;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.09, 0.35, "triangle", 0.22));
    [1046.5, 1318.5, 1568].forEach(f => tone(f, t + 0.4, 0.9, "sine", 0.08));
  }
  function chime() {
    if (!ac) return;
    const scale = [523.25, 587.33, 659.25, 783.99, 880];
    const t = ac.currentTime + 0.01;
    const a = scale[Math.floor(Math.random() * scale.length)];
    tone(a, t, 0.5, "sine", 0.18);
    tone(a * 1.5, t + 0.08, 0.6, "sine", 0.1);
  }
  let noiseBuf = null;
  function popSound(vol = 0.35) {
    if (!ac) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = ac.currentTime;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = "lowpass"; bp.frequency.value = 1800 + Math.random() * 1500;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    src.connect(bp).connect(g).connect(master);
    src.start(t); src.stop(t + 0.5);
    for (let i = 0; i < 5; i++) tone(2000 + Math.random() * 2500, t + 0.08 + Math.random() * 0.35, 0.05, "square", 0.025 * vol / 0.35);
  }
  function wrongSound() {
    if (!ac) return;
    const t = ac.currentTime + 0.02;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.connect(master);
    const notes = [[392, 0.24], [370, 0.24], [349, 0.24], [330, 0.7]];
    let at = t;
    notes.forEach(([f, d], i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f, at);
      if (i === notes.length - 1) {
        o.frequency.exponentialRampToValueAtTime(f * 0.86, at + d);
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = 7; lg.gain.value = 6;
        lfo.connect(lg).connect(o.frequency); lfo.start(at); lfo.stop(at + d);
      }
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.13, at + 0.03);
      g.gain.setValueAtTime(0.13, at + d * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, at + d);
      o.connect(g).connect(lp);
      o.start(at); o.stop(at + d + 0.05);
      at += d + 0.03;
    });
  }

  // ------------------------------------------------------------------
  // Mode cochon (easter egg) : le cochon joue le son de la vidéo
  // ------------------------------------------------------------------
  const PIG_ID = "🐷";
  let pigBuf = null, pigLoading = null;
  const pigMode = item => settings.pig && item && item.id === PIG_ID;
  function loadPig() {
    if (pigBuf) return Promise.resolve(pigBuf);
    if (pigLoading) return pigLoading;
    if (!ac) return Promise.resolve(null);
    pigLoading = fetch("cochon.wav")
      .then(r => { if (!r.ok) throw new Error("son"); return r.arrayBuffer(); })
      .then(data => new Promise((res, rej) => ac.decodeAudioData(data, res, rej)))
      .then(buf => (pigBuf = buf))
      .catch(() => { pigLoading = null; return null; });
    return pigLoading;
  }
  // joue le son ; si le fichier manque, on retombe sur la phrase normale
  function playPig(done, fallbackText) {
    ensureAudio();
    stopSpeech();
    loadPig().then(buf => {
      if (!buf) { fallbackText ? say(fallbackText, done) : (done && done()); return; }
      const src = ac.createBufferSource();
      src.buffer = buf;
      const comp = ac.createDynamicsCompressor();
      const g = ac.createGain();
      g.gain.value = 1;
      src.connect(comp).connect(g).connect(master);
      src.onended = () => done && done();
      src.start();
    });
  }
  function squirt() {
    if (!ac) return;
    if (!noiseBuf) popSound(0.0001);
    const t = ac.currentTime;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const hp = ac.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.setValueAtTime(3000, t); hp.frequency.exponentialRampToValueAtTime(900, t + 0.35);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    src.connect(hp).connect(g).connect(master);
    src.start(t); src.stop(t + 0.45);
  }

  // ------------------------------------------------------------------
  // Feu d'artifice
  // ------------------------------------------------------------------
  const cv = document.getElementById("fx");
  const cx = cv.getContext("2d");
  let W = 0, H = 0;
  function sizeCanvas() {
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  const parts = [], rockets = [];
  let fxRunning = false;
  function burst(x, y, hue, count = 70, vol = 0.3) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 6;
      parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.011 + Math.random() * 0.012,
        hue: (hue + Math.random() * 50 - 25 + 360) % 360,
        size: 2.5 + Math.random() * 3.5,
        star: Math.random() < 0.25
      });
    }
    popSound(vol);
    startFx();
  }
  function launch(delay) {
    setTimeout(() => {
      rockets.push({
        x: W * (0.15 + Math.random() * 0.7), y: H + 10,
        vx: (Math.random() - 0.5) * 2, vy: -(H / 55 + Math.random() * 4),
        ty: H * (0.12 + Math.random() * 0.35),
        hue: Math.floor(Math.random() * 360)
      });
      if (ac) tone(300, ac.currentTime, 0.4, "sine", 0.05, 900);
      startFx();
    }, delay);
  }
  function drawStar(x, y, r) {
    cx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.45 : r;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    cx.closePath(); cx.fill();
  }
  function startFx() { if (!fxRunning) { fxRunning = true; requestAnimationFrame(frame); } }
  function frame() {
    cx.clearRect(0, 0, W, H);
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy *= 0.985;
      cx.fillStyle = `hsl(${r.hue} 90% 55%)`;
      cx.beginPath(); cx.arc(r.x, r.y, 4, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = `hsla(${r.hue} 90% 60% / .35)`;
      cx.beginPath(); cx.arc(r.x - r.vx * 2, r.y - r.vy * 2, 3, 0, Math.PI * 2); cx.fill();
      if (r.y <= r.ty || r.vy > -1.5) { burst(r.x, r.y, r.hue); rockets.splice(i, 1); }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.975; p.vy = p.vy * 0.975 + 0.09;
      p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
      cx.fillStyle = `hsl(${p.hue} 90% ${52 + (1 - p.life) * 15}%)`;
      if (p.star) drawStar(p.x, p.y, p.size * 1.8);
      else { cx.beginPath(); cx.arc(p.x, p.y, p.size * (0.6 + p.life * 0.4), 0, Math.PI * 2); cx.fill(); }
    }
    cx.globalAlpha = 1;
    if (parts.length || rockets.length) requestAnimationFrame(frame);
    else { fxRunning = false; cx.clearRect(0, 0, W, H); }
  }
  function fireworks(x, y, big) {
    burst(x, y, 45, 90);
    const n = big ? 9 : 4;
    for (let i = 0; i < n; i++) launch(150 + i * (big ? 260 : 320));
  }

  // ------------------------------------------------------------------
  // État commun
  // ------------------------------------------------------------------
  const app = document.getElementById("app");
  const board = document.getElementById("board");
  const starsEl = document.getElementById("stars");
  const menu = document.getElementById("menu");
  const homeBtn = document.getElementById("home");
  const STAR_GOAL = 10;
  let mode = null;          // "animals" | "discover" | "family" | null (menu)
  let gen = 0;              // change à chaque changement d'écran : annule les minuteries en cours
  const later = (fn, ms) => { const g = gen; setTimeout(() => { if (g === gen) fn(); }, ms); };

  let level = 2, cleanStreak = 0, roundErrors = 0;
  let target = null, current = [], locked = true, lastWrong = 0, stars = 0;
  let recent = [], hintTimer = null;

  for (let i = 0; i < STAR_GOAL; i++) {
    const s = document.createElement("span");
    s.className = "star"; s.textContent = "⭐";
    starsEl.appendChild(s);
  }
  const renderStars = () => [...starsEl.children].forEach((s, i) => s.classList.toggle("on", i < stars));

  const kidName = () => (settings.kid || "").trim();
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const animalCount = () => settings.count === "auto" ? level : parseInt(settings.count, 10);
  const animalPool = () => settings.pool === "all" ? ANIMALS : ANIMALS.filter(a => a.easy);
  const familyItems = () => family.map((f, i) => ({ id: f.id, name: f.name, img: f.src, t: FAMILY_TINTS[i % FAMILY_TINTS.length] }));
  const quizItems = () => mode === "family" ? familyItems() : animalPool();

  function layout() {
    const n = board.children.length || 2;
    const r = board.getBoundingClientRect();
    let best = 0;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const s = Math.min(r.width / (cols + (cols - 1) * 0.12), r.height / (rows + (rows - 1) * 0.12));
      if (s > best) best = s;
    }
    const cell = Math.max(64, Math.min(best * 0.86, 360));
    document.documentElement.style.setProperty("--cell", cell + "px");
  }

  function makeCard(item, i, onPress) {
    const b = document.createElement("button");
    b.className = "animal";
    b.style.setProperty("--tint", item.t || "#f3f0fa");
    b.style.setProperty("--d", (i * 0.08) + "s");
    b.setAttribute("aria-label", item.name);
    if (item.img) {
      b.classList.add("photo");
      const im = document.createElement("img");
      im.src = item.img; im.alt = ""; im.draggable = false;
      b.appendChild(im);
    } else {
      const s = document.createElement("span");
      s.textContent = item.e;
      b.appendChild(s);
    }
    b.addEventListener("pointerdown", e => { e.preventDefault(); ensureAudio(); onPress(item, b); });
    return b;
  }

  // ------------------------------------------------------------------
  // Jeux « Où est… ? » (animaux ou famille)
  // ------------------------------------------------------------------
  const question = () => `Où est ${target.name} ?`;

  function newRound() {
    clearTimeout(hintTimer);
    roundErrors = 0;
    const items = quizItems();
    if (items.length < 2) { goMenu(); return; }
    const n = Math.max(2, Math.min(animalCount(), items.length));
    const keep = items.length <= 2 ? 0 : Math.max(1, Math.min(5, items.length - n));
    let candidates = items.filter(a => !recent.includes(a.id));
    if (!candidates.length) candidates = items;
    target = pick(candidates);
    recent.push(target.id);
    while (recent.length > keep) recent.shift();
    const others = shuffle(items.filter(a => a.id !== target.id)).slice(0, n - 1);
    current = shuffle([target, ...others]);

    board.innerHTML = "";
    current.forEach((a, i) => board.appendChild(makeCard(a, i, onQuizTap)));
    layout();
    locked = true;
    later(() => {
      say(question(), () => { locked = false; });
      later(() => { locked = false; }, 700);   // on peut toucher dès que la voix a commencé
    }, 450 + n * 80);
  }

  function onQuizTap(item, el) {
    if (locked) return;
    if (item.id === target.id) win(el); else lose(item, el);
  }

  function win(el) {
    locked = true;
    clearTimeout(hintTimer);
    [...board.children].forEach(c => { if (c !== el) c.classList.add("fade"); c.classList.remove("hint", "no"); });
    el.classList.add("win");
    const pigWin = pigMode(target);
    if (!pigWin) successSound();
    const r = el.getBoundingClientRect();
    stars++;
    const full = stars >= STAR_GOAL;
    renderStars();
    fireworks(r.left + r.width / 2, r.top + r.height / 2, full);

    if (roundErrors === 0) cleanStreak++; else cleanStreak = 0;
    if (cleanStreak >= 3 && level < 4) { level++; cleanStreak = 0; }

    const cheer = pick(["Bravo !", "Super !", "Oui, bravo !", "Génial !"]);
    const praise = mode === "family" ? `C'est ${target.name} !` : target.c;
    const kid = kidName();
    const line = full
      ? `Bravo${kid ? " " + kid : ""} ! ${praise} Tu as gagné toutes les étoiles !`
      : `${cheer} ${praise}`;
    const winAt = Date.now();
    const next = () => {
      // laisser le feu d'artifice se terminer avant la manche suivante
      const minShow = full ? 5200 : 3000;
      later(() => {
        if (full) { stars = 0; renderStars(); }
        newRound();
      }, Math.max(600, minShow - (Date.now() - winAt)));
    };
    if (pigWin) playPig(() => { if (full) say(line, next); else next(); }, line);
    else later(() => say(line, next), 350);
  }

  function lose(item, el) {
    const now = Date.now();
    if (now - lastWrong < 1200) return;   // les petits doigts tapent vite
    lastWrong = now;
    roundErrors++;
    cleanStreak = 0;
    if (settings.count === "auto" && roundErrors === 2 && level > 2) level--;
    el.classList.remove("no"); void el.offsetWidth; el.classList.add("no");
    setTimeout(() => el.classList.remove("no"), 600);
    clearTimeout(hintTimer);
    const g = gen;
    const explain = () => {
      if (g !== gen) return;
      say(`Ça, c'est ${item.name}. ${question()}`, () => {
        if (roundErrors >= 2) {
          const t = [...board.children][current.indexOf(target)];
          t && t.classList.add("hint");
        }
      });
    };
    if (pigMode(item)) { playPig(explain); return; }
    wrongSound();
    hintTimer = setTimeout(explain, 1150);
  }

  speakBtn.addEventListener("click", () => {
    ensureAudio();
    if (mode && mode !== "discover" && target && !board.querySelector(".win")) say(question());
  });

  // ------------------------------------------------------------------
  // Découverte : on touche, on écoute, pas d'erreur possible
  // ------------------------------------------------------------------
  let discoverSet = [], heard = new Set(), lastDiscoverTap = 0;
  function newDiscover() {
    const p = animalPool();
    const prev = discoverSet.map(a => a.id);
    let fresh = shuffle(p.filter(a => !prev.includes(a.id)));
    if (fresh.length < 4) fresh = shuffle(p.slice());
    discoverSet = fresh.slice(0, 4);
    heard = new Set();
    board.innerHTML = "";
    discoverSet.forEach((a, i) => board.appendChild(makeCard(a, i, onDiscoverTap)));
    layout();
  }
  function onDiscoverTap(item, el) {
    const now = Date.now();
    if (now - lastDiscoverTap < 450) return;
    lastDiscoverTap = now;
    [...board.children].forEach(c => c.classList.remove("big"));
    void el.offsetWidth;
    el.classList.add("big");
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, Math.random() * 360, 40, 0.15);
    chime();
    heard.add(item.id);
    const after = () => {
      el.classList.remove("big");
      if (heard.size >= discoverSet.length) later(newDiscover, 900);
    };
    if (pigMode(item)) playPig(after, item.c);
    else say(item.c, after);
  }
  document.getElementById("next").addEventListener("click", () => {
    ensureAudio();
    stopSpeech();
    chime();
    newDiscover();
  });

  // ------------------------------------------------------------------
  // Menu et changement de jeu
  // ------------------------------------------------------------------
  function renderMenu() {
    const h = document.getElementById("menuTitle");
    const kid = kidName();
    h.textContent = "Les jeux";
    if (kid) {
      const em = document.createElement("em");
      em.textContent = (/^[aeiouyhâàéèêëîïôöûüœ]/i.test(kid) ? " d'" : " de ") + kid;
      h.appendChild(em);
    }
    const art = document.getElementById("familyArt");
    const sub = document.getElementById("familySub");
    art.innerHTML = "";
    if (family.length) {
      family.slice(0, 3).forEach(f => {
        const im = document.createElement("img");
        im.src = f.src; im.alt = "";
        art.appendChild(im);
      });
    } else art.textContent = "📷";
    sub.textContent = family.length >= 2 ? "Trouver qui c'est" : "Ajoute des photos";
  }

  let wakeLock = null;
  function keepAwake() {
    try {
      if (navigator.wakeLock && !wakeLock) {
        navigator.wakeLock.request("screen").then(l => { wakeLock = l; l.addEventListener("release", () => { wakeLock = null; }); }).catch(() => {});
      }
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && mode) keepAwake(); });

  function startMode(m) {
    ensureAudio();
    pickVoice();
    if (m === "family" && family.length < 2) { openPanel("family"); return; }
    gen++;
    mode = m;
    app.dataset.mode = m;
    menu.hidden = true;
    homeBtn.hidden = false;
    keepAwake();
    if (settings.pig) loadPig();
    stars = 0; renderStars();
    level = 2; cleanStreak = 0; recent = []; discoverSet = [];
    board.innerHTML = "";
    const intro = m === "discover" ? "Touche les animaux !" : m === "family" ? "On cherche la famille !" : "C'est parti !";
    say(intro, null, true);   // tout de suite, pendant le toucher
    successSound();
    later(() => (m === "discover" ? newDiscover() : newRound()), 1300);
  }
  function goMenu() {
    gen++;
    mode = null;
    clearTimeout(hintTimer);
    stopSpeech();
    board.innerHTML = "";
    renderMenu();
    menu.hidden = false;
    homeBtn.hidden = true;
  }
  document.querySelectorAll(".tile").forEach(t => t.addEventListener("click", () => startMode(t.dataset.mode)));

  // ---------- easter egg : le pistolet à eau ----------
  const egg = document.getElementById("egg");
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.hidden = true; void toast.offsetWidth; toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 2200);
  }
  const syncEgg = () => egg.classList.toggle("on", !!settings.pig);
  egg.addEventListener("click", () => {
    ensureAudio();
    settings.pig = !settings.pig;
    saveSettings();
    syncEgg();
    squirt();
    showToast(settings.pig ? "Mode 🐷 activé" : "Mode 🐷 désactivé");
    if (settings.pig) loadPig();
  });
  syncEgg();

  // ------------------------------------------------------------------
  // Réglages parent : appui long sur la roue
  // ------------------------------------------------------------------
  const panel = document.getElementById("panel");
  // Boutons pour les parents : il faut garder le doigt appuyé 1,5 s
  function holdButton(el, action) {
    let timer = null;
    const cancel = () => { clearTimeout(timer); el.classList.remove("holding"); };
    el.addEventListener("pointerdown", e => {
      e.preventDefault();
      el.classList.add("holding");
      timer = setTimeout(() => { cancel(); action(); }, 1500);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, cancel));
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") action(); });
  }
  holdButton(document.getElementById("gear"), () => openPanel());
  holdButton(homeBtn, () => { if (mode) goMenu(); });

  function syncSeg(id, key) {
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === settings[key])));
  }
  function bindSeg(id, key, onChange) {
    document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener("click", () => {
      settings[key] = b.dataset.v; saveSettings(); syncSeg(id, key); onChange && onChange();
    }));
    syncSeg(id, key);
  }
  bindSeg("segCount", "count");
  bindSeg("segPool", "pool", () => { recent = []; });
  bindSeg("segRate", "rate");

  const kidInput = document.getElementById("kidName");
  kidInput.value = settings.kid || "";
  kidInput.addEventListener("input", () => { settings.kid = kidInput.value.trim(); saveSettings(); renderMenu(); });

  function openPanel(section) {
    gen++;
    locked = true;
    clearTimeout(hintTimer);
    stopSpeech();
    panel.hidden = false;
    if (section === "family") {
      setTimeout(() => document.getElementById("famSection").scrollIntoView({ block: "start", behavior: "smooth" }), 50);
    }
  }
  function closePanel() {
    panel.hidden = true;
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    if (!mode) { renderMenu(); return; }
    gen++;
    if (mode === "family" && family.length < 2) { goMenu(); return; }
    if (mode === "discover") newDiscover(); else newRound();
  }
  document.getElementById("closePanel").addEventListener("click", closePanel);
  document.getElementById("toMenu").addEventListener("click", () => { panel.hidden = true; goMenu(); });
  document.getElementById("testVoice").addEventListener("click", () => {
    ensureAudio(); pickVoice(); say("Où est le chien ? Le chien fait ouaf, ouaf !", null, true);
  });

  // ---------- gestion des photos ----------
  const famList = document.getElementById("famList");
  const famEmpty = document.getElementById("famEmpty");
  const famFile = document.getElementById("famFile");
  const famName = document.getElementById("famName");
  const famAdd = document.getElementById("famAdd");
  const famPreview = document.getElementById("famPreview");
  let pendingPhoto = null;

  function renderFamilyList() {
    famList.innerHTML = "";
    family.forEach(f => {
      const li = document.createElement("li");
      const im = document.createElement("img"); im.src = f.src; im.alt = "";
      const who = document.createElement("span"); who.className = "who"; who.textContent = f.name;
      const del = document.createElement("button"); del.className = "del"; del.textContent = "Retirer";
      del.addEventListener("click", async () => {
        if (!del.classList.contains("sure")) {
          del.classList.add("sure"); del.textContent = "Sûr ?";
          setTimeout(() => { del.classList.remove("sure"); del.textContent = "Retirer"; }, 3000);
          return;
        }
        try { await DB.del(f.id); } catch (e) {}
        loadFamily();
      });
      li.append(im, who, del);
      famList.appendChild(li);
    });
    famEmpty.hidden = family.length >= 2;
    famEmpty.textContent = family.length === 1 ? "Encore une personne et on peut jouer !" : "Ajoute au moins 2 personnes pour jouer.";
  }
  const updateAddBtn = () => { famAdd.disabled = !(pendingPhoto && famName.value.trim()); };
  famName.addEventListener("input", updateAddBtn);

  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
      img.src = url;
    });
  }
  async function squarePhoto(file) {
    const img = await loadImage(file);
    const w = img.naturalWidth, h = img.naturalHeight;
    const s = Math.min(w, h);
    const sx = (w - s) / 2;
    const sy = (h - s) * 0.3;           // un peu vers le haut : on garde le visage
    const out = 480;
    const c = document.createElement("canvas");
    c.width = out; c.height = out;
    c.getContext("2d").drawImage(img, sx, sy, s, s, 0, 0, out, out);
    return c.toDataURL("image/jpeg", 0.85);
  }
  famFile.addEventListener("change", async () => {
    const f = famFile.files && famFile.files[0];
    if (!f) return;
    try {
      pendingPhoto = await squarePhoto(f);
      famPreview.src = pendingPhoto; famPreview.hidden = false;
    } catch (e) {
      pendingPhoto = null; famPreview.hidden = true;
      famEmpty.hidden = false; famEmpty.textContent = "Cette photo n'a pas pu être lue. Essaie une autre photo.";
    }
    famFile.value = "";
    updateAddBtn();
    if (!famName.value.trim()) famName.focus();
  });
  famAdd.addEventListener("click", async () => {
    const name = famName.value.trim();
    if (!pendingPhoto || !name) return;
    famAdd.disabled = true;
    try {
      await DB.put({ id: "p" + Date.now() + Math.random().toString(36).slice(2, 6), name, src: pendingPhoto, created: Date.now() });
    } catch (e) {
      famEmpty.hidden = false; famEmpty.textContent = "Impossible d'enregistrer la photo sur cet appareil.";
    }
    pendingPhoto = null; famPreview.hidden = true; famPreview.removeAttribute("src"); famName.value = "";
    famName.blur();
    await loadFamily();
    ensureAudio();
    say(`C'est ${name} !`);
  });

  // ------------------------------------------------------------------
  // iPad : pas de zoom, pas de défilement
  // ------------------------------------------------------------------
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("touchmove", e => {
    if (panel.hidden && !e.target.closest(".menu")) e.preventDefault();
  }, { passive: false });
  document.addEventListener("contextmenu", e => e.preventDefault());

  function onResize() { sizeCanvas(); layout(); }
  window.addEventListener("resize", onResize);
  onResize();
  renderStars();
  renderMenu();
  loadFamily();

  // Version installée (hors ligne) : fonctionne sans réseau
  if ("serviceWorker" in navigator && document.querySelector('link[rel="manifest"]')) {
    try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
  }
})();
</script>

</body>
</html>
